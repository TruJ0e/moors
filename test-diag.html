<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// SS1 diagnostics namespace: runtime errors land in window.__moors.errors
// and raise the banner; TEST reads this namespace.
window.__moors = window.__moors || { errors: [] };

// MOORS — BUILD round 1 scaffold.
// Frozen plan: plan v229 (SHA-256 b4fff2f67dd03029827e0a0242f835b9232ef5cf19eff854093000192956bd18).
// Single self-contained file; the Three.js module is the only external asset (per spec).

const container = document.getElementById('app');
const overlay = document.getElementById('overlay');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b12);
// SS3.1 (C10, @gpt ruling): ONE uniform FogExp2 at the plan's density —
// no height-fog shader patch, no time variation of the density value.
scene.fog = new THREE.FogExp2(0x070b12, 0.0145);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.LinearToneMapping;
renderer.toneMappingExposure = 1.0;

// AM1: one locked moon direction (azimuth 35 deg, elevation 16 deg) derives
// the light, the disc, and the halo — nothing else invents a moon position.
const MOON_AZ = 35 * Math.PI / 180, MOON_EL = 16 * Math.PI / 180;
const MOON_DIR = new THREE.Vector3(
  Math.sin(MOON_AZ) * Math.cos(MOON_EL), Math.sin(MOON_EL), -Math.cos(MOON_AZ) * Math.cos(MOON_EL)).normalize();
const moonLight = new THREE.DirectionalLight(0x9bb4d8, 0.45);
moonLight.position.copy(MOON_DIR).multiplyScalar(300);
scene.add(moonLight);
// SS3.2 retained fill (C12): hemisphere light, sky #1a273b / ground #0d100e.
scene.add(new THREE.HemisphereLight(0x1a273b, 0x0d100e, 0.18));

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.25, 1400);
camera.position.set(0, 2, 0);



// ---- Terrain (BUILD round 2) -------------------------------------------------
// Frozen-plan rules honored here: the heightmap is generated from a seed by a
// pipeline that knows nothing about any placed feature (CD2); the rim that
// closes the world is part of the height function itself (BP2); the world's
// identity is a content-derived fingerprint over heights + parameters + seed
// + generator version (BW2), exposed for audit as window.__MOORS_WORLD__.
const GEN_VERSION = 'moors-terrain-gen-3';
// SS2 (R7 conformance): seed is the plan's locked default, overridable via
// ?seed=<int>; the world is 640x640 m on a 256x256-cell mesh (delta 2.5 m).
// TH2 single-authority seed parse (R12 replacement for the ?seed= lines):
// grammar ^[+-]?[0-9]+$ over the whole decoded value; duplicate seed
// params are invalid; missing/empty/invalid selects the default silently
// (application-side; the TEST harness asserts the effective seed itself).
// Normalization is exact integer arithmetic (BigInt) modulo 2^32 — never
// floating point, so thousand-digit inputs normalize exactly. Parsed ONCE
// here; the result is the sole root of every stream derivation, and
// window.__moors.seed reports it (set beside __MOORS_WORLD__).
function parseSeed(search) {
  const raw = String(search || '').replace(/^\?/, '');
  const values = [];
  if (raw) for (const pair of raw.split('&')) {
    const eq = pair.indexOf('=');
    const k = eq < 0 ? pair : pair.slice(0, eq);
    if (k === 'seed') values.push(eq < 0 ? '' : pair.slice(eq + 1));
  }
  if (values.length !== 1) return 0x4D4F4F52;
  let v;
  try { v = decodeURIComponent(values[0].replace(/\+/g, '%20')); } catch (e) { return 0x4D4F4F52; }
  if (!/^[+-]?[0-9]+$/.test(v)) return 0x4D4F4F52;
  const neg = v.charAt(0) === '-';
  const digits = v.replace(/^[+-]/, '');
  let n = BigInt(digits) % 4294967296n;
  if (neg) n = (4294967296n - n) % 4294967296n;
  return Number(n);
}
const EFFECTIVE_SEED = parseSeed(typeof location !== 'undefined' ? location.search : '');
const WORLD = {
  seed: EFFECTIVE_SEED,
  size: 640,          // world is size x size metres, centred on origin
  segments: 256
};

function hash2(ix, iz, seed) {
  // Integer hash with LOGICAL shifts — an arithmetic-shift xorshift can never
  // set the top bit (bit31 ^ bit31 = 0), which capped the old version at 0.5
  // and starved every noise-driven system (found in BUILD round 4, TT2-B4-06).
  let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(seed, 974634211);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function smooth(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // quintic Hermite (SS2)
function valueNoise(x, z, seed) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed);
  const c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
  const ux = smooth(fx), uz = smooth(fz);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}
function fbm(x, z, seed, octaves = 5) {
  let sum = 0, amp = 1, freq = 1, norm = 0;
  for (let o = 0; o < octaves; o++) {
    sum += amp * valueNoise(x * freq, z * freq, seed + o * 101);
    norm += amp;
    amp *= 0.5; freq *= 2.1;
  }
  return sum / norm; // 0..1
}
// The one height function: geometry, camera, and collision all read this.
// SS2 construction (R7): domain warp first (two octaves, lambda ~180 m,
// +/-18 m), then three bands — broad fells (lambda 140-220 m, amp 14-18),
// peat hags (lambda 35-70 m, amp 2.5-4.5), tussock micro-relief
// (lambda 6-16 m, amp 0.20-0.55) — then the spawn clearing flatten
// (unwarped coordinates; G5: the target plane descends toward the circle).
const CIRCLE_DIR = (() => { const l = Math.hypot(45, -105); return { x: 45 / l, z: -105 / l }; })();
function terrainHeight(x, z) {
  const wx = (fbm(x / 180 + 13.1, z / 180 + 7.7, WORLD.seed + 31, 2) - 0.5) * 36;
  const wz = (fbm(x / 180 + 3.9, z / 180 + 21.3, WORLD.seed + 47, 2) - 0.5) * 36;
  const px = x + wx, pz = z + wz;
  let h = (fbm(px / 180 + 31.7, pz / 180 + 11.3, WORLD.seed, 5) - 0.5) * 2 * 16
        + (fbm(px / 50 + 7.9, pz / 50 + 3.1, WORLD.seed + 77, 3) - 0.5) * 2 * 3.5
        + (fbm(px / 11 + 51.3, pz / 11 + 27.9, WORLD.seed + 111, 2) - 0.5) * 2 * 0.375;
  // BP1/BP2 border country (C08, R10): a radial rise inside the leash zone
  // so SS5 slope discipline closes the world topologically — proven by a
  // flood-fill over GRID under the TR4 slope definition (build log rB10).
  // Constants pinned in the conformance register; M14 leash is the backstop.
  const br = Math.hypot(x, z);
  if (br > 230) { const bt = Math.min(1, (br - 230) / 55); h += 48 * (bt * bt * (3 - 2 * bt)); }
  const r = Math.hypot(x, z);
  if (r < 28) {
    const target = -Math.tan(1.5 * Math.PI / 180) * (x * CIRCLE_DIR.x + z * CIRCLE_DIR.z);
    const t = THREE.MathUtils.clamp((r - 12) / 16, 0, 1);
    const w = t * t * (3 - 2 * t);
    h = target + (h - target) * w;
  }
  return h;
}
function worldFingerprint() {
  // FNV-1a over quantized sample heights + generation parameters (BW2).
  let h = 0x811c9dc5;
  const mix = (s) => { for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } };
  mix(GEN_VERSION + '|' + WORLD.seed + '|' + WORLD.size + '|' + WORLD.segments + '|');
  const half = WORLD.size / 2;
  for (let gx = -half; gx <= half; gx += 16) {
    for (let gz = -half; gz <= half; gz += 16) {
      mix(groundHeight(gx, gz).toFixed(3) + ',');
    }
  }
  return ('0000000' + (h >>> 0).toString(16)).slice(-8);
}

// The height grid the mesh is built from (SS2): the custom geometry's
// vertices ARE this array, and groundHeight() interpolates it with the same
// diagonal the index buffer uses — mesh, physics, and camera share one
// surface (C33). terrainHeight() remains the generation authority.
const GRID = (() => {
  const n = WORLD.segments + 1, half = WORLD.size / 2, step = WORLD.size / WORLD.segments;
  const g = new Float32Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) g[j * n + i] = terrainHeight(-half + i * step, -half + j * step);
  return { g, n, half, step };
})();
function groundHeight(x, z) {
  // SS2 exact interpolation: u=(x+320)/2.5, v=(z+320)/2.5; fu>=fv selects the
  // upper-right triangle (a,b,d), fu<fv the lower-left (a,d,c), split along
  // the (x0,z0)-(x1,z1) diagonal — the same split the mesh index buffer uses.
  const { g, n, half, step } = GRID;
  // G8 precise form: clamp to the inclusive domain first; on the
  // positive boundary the cell is 255 with fraction exactly 1, so
  // out-of-domain queries return exactly the boundary result.
  const fx = THREE.MathUtils.clamp((x + half) / step, 0, WORLD.segments);
  const fz = THREE.MathUtils.clamp((z + half) / step, 0, WORLD.segments);
  let i = Math.floor(fx), j = Math.floor(fz);
  if (i >= WORLD.segments) i = WORLD.segments - 1;
  if (j >= WORLD.segments) j = WORLD.segments - 1;
  const fu = fx - i, fv = fz - j;
  const a = g[j * n + i], b = g[j * n + i + 1], c = g[(j + 1) * n + i], d = g[(j + 1) * n + i + 1];
  if (fu >= fv) return a + (b - a) * fu + (d - b) * fv;
  return a + (d - c) * fu + (c - a) * fv;
}

window.__MOORS_WORLD__ = { seed: WORLD.seed, gen: GEN_VERSION, fingerprint: worldFingerprint(), params: Object.assign({}, WORLD) };
window.__moors.seed = WORLD.seed; // TH2: the single-authority effective seed
window.__moors.diagnostics = { fogDensity: 0.0145, hemisphereIntensity: 0.18, moonIntensity: 0.45, gen: GEN_VERSION, fingerprint: window.__MOORS_WORLD__.fingerprint }; // AT2/AT5

// TR4: slope has ONE definition — the gradient of GRID by central
// differences, expressed as an angle. Placement, movement admissibility,
// and every audit read this function.
function gridSlope(x, z) {
  const { g, n, half, step } = GRID;
  let i = Math.round((x + half) / step), j = Math.round((z + half) / step);
  i = Math.min(n - 2, Math.max(1, i)); j = Math.min(n - 2, Math.max(1, j));
  const gx = (g[j * n + i + 1] - g[j * n + i - 1]) / (2 * step);
  const gz = (g[(j + 1) * n + i] - g[(j - 1) * n + i]) / (2 * step);
  const mag = Math.hypot(gx, gz);
  return { gx, gz, mag, angleDeg: Math.atan(mag) * 180 / Math.PI };
}

const terrainGeo = (() => {
  // Custom indexed geometry (SS2): vertices ARE the GRID; every cell splits
  // along (x0,z0)-(x1,z1) via triangles (a,d,b) and (a,c,d) — winding chosen
  // so face normals point +Y (cross products verified in the R7 harness).
  const n = GRID.n, half = GRID.half, step = GRID.step;
  const posArr = new Float32Array(n * n * 3);
  const colArr = new Float32Array(n * n * 3);
  const heather = new THREE.Color(0x3b263d);   // SS3.6 palette
  const moss = new THREE.Color(0x242b1e);      // moor grass
  const peat = new THREE.Color(0x2e241d);
  const rock = new THREE.Color(0x55565a);
  const tmp = new THREE.Color();
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const k = j * n + i, x = -half + i * step, z = -half + j * step, y = GRID.g[k];
    posArr[k * 3] = x; posArr[k * 3 + 1] = y; posArr[k * 3 + 2] = z;
    const t = THREE.MathUtils.clamp((y + 20) / 46, 0, 1);
    const patch = fbm(x * 0.06 + 91.2, z * 0.06 + 47.8, WORLD.seed + 5);
    tmp.copy(moss).lerp(peat, THREE.MathUtils.clamp(patch * 1.4 - 0.2, 0, 1));
    if (patch > 0.62) tmp.lerp(heather, THREE.MathUtils.clamp((patch - 0.62) * 2.2, 0, 0.8));
    if (t > 0.78) tmp.lerp(rock, (t - 0.78) * 2.4);
    // SS3.4 hollow AO per AT6: ground below the mean of its four 2.5 m
    // neighbours darkens.
    if (i >= 1 && i < n - 1 && j >= 1 && j < n - 1) {
      const avg = (GRID.g[k - 1] + GRID.g[k + 1] + GRID.g[k - n] + GRID.g[k + n]) / 4;
      const depth = avg - y;
      if (depth > 0.4) tmp.multiplyScalar(1 - Math.min(0.25, (depth - 0.4) * 0.15));
    }
    colArr[k * 3] = tmp.r; colArr[k * 3 + 1] = tmp.g; colArr[k * 3 + 2] = tmp.b;
  }
  const idx = new Uint32Array(WORLD.segments * WORLD.segments * 6);
  let q = 0;
  for (let j = 0; j < WORLD.segments; j++) for (let i = 0; i < WORLD.segments; i++) {
    const a = j * n + i, b = a + 1, c = a + n, d = c + 1;
    idx[q++] = a; idx[q++] = d; idx[q++] = b;
    idx[q++] = a; idx[q++] = c; idx[q++] = d;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  return geo;
})();
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 }));
scene.add(terrain);

const EYE = 1.7;
camera.position.set(0, groundHeight(0, 0) + EYE, 0);


// ---- Atmosphere (BUILD round 3) ----------------------------------------------
// Frozen-plan rules: the moon is the only real light; fog parameters never vary
// with world position (BQ2/BX2) — the mist breathes over TIME only, uniformly,
// everywhere. Stars and moon ignore fog (they are the sky, BA2 continuity).
function radialTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); return t;
}
// Moon disc + halo (SS3.2): disc radius ~29.8 m at 950 m along MOON_DIR;
// halo is a FIXED plane perpendicular to the light vector (AW1) — never a
// camera-facing sprite.
const skyGroup = new THREE.Group();
scene.add(skyGroup);
const moonDisc = new THREE.Mesh(
  new THREE.CircleGeometry(29.8, 40),
  new THREE.MeshBasicMaterial({ color: 0xdbe8ff, fog: false })
);
moonDisc.position.copy(MOON_DIR).multiplyScalar(950);
moonDisc.lookAt(0, 0, 0);
skyGroup.add(moonDisc);
moonDisc.renderOrder = -1; moonDisc.material.depthTest = true; // AT4: sky renders strictly before opaque
const moonGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(210, 210),
  new THREE.MeshBasicMaterial({
    map: radialTexture('rgba(168,190,224,0.5)', 'rgba(168,190,224,0)'),
    fog: false, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  })
);
moonGlow.position.copy(MOON_DIR).multiplyScalar(940);
moonGlow.lookAt(moonGlow.position.clone().add(MOON_DIR));
skyGroup.add(moonGlow);
moonGlow.renderOrder = -1; moonGlow.material.depthTest = true; // AT4: sky renders strictly before opaque

// Stars (SS3.3): 1,200 points on a 1,000 m dome, 1-2 px, Milky Way band;
// brightness fades toward the horizon via vertex colours.
{
  const N = 1200, posArr = new Float32Array(N * 3), colArr = new Float32Array(N * 3);
  const starRng = mulberry32(WORLD.seed ^ 0x53544152); // S-stream: stars are seeded like everything else (rB30; found by @gemini R29)
  const bandNormal = new THREE.Vector3(0.35, 0.55, 0.76).normalize();
  const v = new THREE.Vector3();
  let placed = 0, guard = 0;
  while (placed < N && guard++ < N * 40) {
    v.set(starRng() * 2 - 1, starRng() * 2 - 1, starRng() * 2 - 1);
    if (v.lengthSq() > 1 || v.lengthSq() < 0.05) continue;
    v.normalize();
    if (v.y < 0.08) continue;                       // fade floor (SS3.3)
    if (Math.abs(v.dot(bandNormal)) > 0.16 && starRng() > 0.12) continue; // the band
    posArr[placed * 3] = v.x * 1000; posArr[placed * 3 + 1] = v.y * 1000; posArr[placed * 3 + 2] = v.z * 1000;
    const b = 0.25 + 0.75 * Math.min(1, (v.y - 0.08) / 0.3);
    colArr[placed * 3] = 0.68 * b; colArr[placed * 3 + 1] = 0.74 * b; colArr[placed * 3 + 2] = 0.82 * b;
    placed++;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    vertexColors: true, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.85, depthWrite: false
  }));
  skyGroup.add(stars);
stars.renderOrder = -1; stars.material.depthTest = true; // AT4
}

// Horizon skirt (SS2, C07): concentric square rings expanding from the mesh
// perimeter to a 990 m half-size (corners reach the 1,400 m far plane). Ring 0
// IS the main mesh's perimeter — the same 1,024 boundary vertices at the same
// coordinates and heights — so the two surfaces share exact vertices as the
// plan requires; outward rings sample terrainHeight with relief attenuation.
{
  const PER = []; // the mesh perimeter loop: 256 steps per side, corners once
  for (let i = 0; i < 256; i++) PER.push([-320 + i * 2.5, -320]);
  for (let j = 0; j < 256; j++) PER.push([320, -320 + j * 2.5]);
  for (let i = 0; i < 256; i++) PER.push([320 - i * 2.5, 320]);
  for (let j = 0; j < 256; j++) PER.push([-320, 320 - j * 2.5]);
  const RINGS = 12, S0 = 320, S1 = 990;
  const verts = [], idx = [];
  for (let ring = 0; ring <= RINGS; ring++) {
    const half = S0 + (S1 - S0) * (ring / RINGS) * (ring / RINGS);
    const atten = ring === 0 ? 1 : 1 - 0.85 * (ring / RINGS);
    for (const [bx, bz] of PER) {
      const x = bx / 320 * half, z = bz / 320 * half;
      verts.push(x, terrainHeight(x, z) * atten, z);
    }
  }
  const W = PER.length;
  for (let ring = 0; ring < RINGS; ring++) for (let s = 0; s < W; s++) {
    const a = ring * W + s, b = ring * W + (s + 1) % W, c = a + W, d = b + W;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const skirt = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x0d1117 }));
  scene.add(skirt);
}

// Mist banks (SS3.5 Tier 0): 16 HORIZONTAL planes, footprint-sampled
// placement over groundHeight (center + 4 cardinal samples at 0.4 x radius;
// reject relief > 2.2 m or above-median sites), fog-lit material, slow
// westerly drift with far-side wrap. No billboards, no random heights.
const mistTex = radialTexture('rgba(255,255,255,0.85)', 'rgba(255,255,255,0)');
const mistMat = new THREE.MeshBasicMaterial({
  color: 0x0b111c, map: mistTex, transparent: true, opacity: 0.14,
  depthWrite: false, fog: true, side: THREE.DoubleSide
});
const mistRng = mulberry32(WORLD.seed ^ 0x51f15e);
const GRID_MEDIAN = (() => {
  const s = [];
  for (let k = 0; k < GRID.g.length; k += 613) s.push(GRID.g[k]);
  s.sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
})();
function mistFootprintY(x, z, radius) {
  const pts = [[x, z], [x + radius * 0.4, z], [x - radius * 0.4, z], [x, z + radius * 0.4], [x, z - radius * 0.4]]
    .map(([px, pz]) => groundHeight(px, pz));
  const sorted = [...pts].sort((a, b) => a - b);
  if (sorted[4] - sorted[0] > 2.2) return null;      // relief rule
  if (pts[0] > GRID_MEDIAN) return null;             // low ground only
  return Math.max(pts[0] + 0.55, sorted[3] + 0.25);  // centre vs p75 rule
}
const mistBanks = [];
for (let i = 0; i < 16; i++) {
  const size = 40 + mistRng() * 35;
  let x = 0, z = 0, y = null, fallbackCand = null;

      const dx = m.position.x - player.x, dz = m.position.z - player.z;
      if (dx * dx + dz * dz > 160 * 160) {
        // SS3.5 wrap (rB8-gpt correction): a candidate commits ONLY with a
        // valid footprint at its own location — never a new x/z with an old
        // y. Bounded resampling; on failure the bank holds at the boundary
        // (its current footprint stays valid) and retries on later frames.
        let placed = false;
        for (let att = 0; att < 8 && !placed; att++) {
          const cx = m.position.x - 600;
          const cz = att === 0 ? m.position.z : -280 + mistRng() * 560;
          const y = mistFootprintY(cx, cz, m.userData.radius);
          if (y !== null) { m.position.x = cx; m.position.z = cz; m.position.y = y; placed = true; }
        }
        if (!placed) m.position.x = 300;
      }
    }
  }
  if (locked || dragLook || TEST_MODE) stepMovement(Math.min(dt, 0.05));
  else {
    camera.position.set(player.x, groundHeight(player.x, player.z) + EYE, player.z);
    camera.rotation.y = yaw; camera.rotation.x = pitch;
    window.__MOORS_PLAYER__ = { x: +player.x.toFixed(2), z: +player.z.toFixed(2), yaw: +yaw.toFixed(3) };
  }
  syncAudioListener(); // AU2: listener follows the camera every frame
  updateDiagnostics(dt); // SS8 live diagnostics
  updateQualityTier(dt); // SS7/P1 tier step-down
  renderer.render(scene, camera);
}
animate();
</script>
